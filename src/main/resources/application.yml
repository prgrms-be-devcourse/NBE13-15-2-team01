spring:
  application:
    name: ticketing
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:ticketing}
    password:  ${DB_PASSWORD:ticketing1234}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
  sql:
    init:
      mode: always
  jackson:
    time-zone: Asia/Seoul

springdoc:
  swagger-ui:
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    org.hibernate.SQL: debug

ticketing:
  kopis:
    service-key: ${KOPIS_SERVICE_KEY:}
    base-url: http://www.kopis.or.kr/openApi/restful
  jwt:
    secret: ${JWT_SECRET}
    access-seconds: 900       # 15분
    refresh-seconds: 604800   # 7일